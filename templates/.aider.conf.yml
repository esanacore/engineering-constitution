# Eric's Engineering Constitution — Aider configuration.
# Add project-specific settings below.
# See constitution/INTEGRATION.md for override guidance.

# Follow the constitution workflow; never auto-commit.
auto-commits: false

# Load constitution files as read-only context on every session. Includes
# docs/SESSION_PLAN.md so a previous interrupted session's plan is always
# visible, and docs/MEMORY.md so codebase memory is preserved; write your
# own plan in docs/SESSION_PLAN.md before implementing, and clear or archive
# it when the session completes.
#
# End every push with a Next Steps procedure (`constitution/AI_WORKFLOW.md`,
# "Next Steps Procedure"): a numbered checklist of what happens next, each
# step tagged HUMAN, AGENT, or AUTOMATED, with every step only a person can
# do (hardware, credentials, approvals) called out and described; put it in
# the pull request and `docs/AGENT_HANDOFF.md`.
read:
  - AGENTS.md
  - constitution/CONSTITUTION.md
  - constitution/AI_WORKFLOW.md
  - README.md
  # aider loads read files whole; TODO.md and CHANGELOG.md grow without bound,
  # so their context cost rises over time. Measure with
  # constitution/scripts/measure_instruction_weight.sh and prune here if needed.
  - TODO.md
  - CHANGELOG.md
  - docs/SESSION_PLAN.md
  - docs/MEMORY.md
